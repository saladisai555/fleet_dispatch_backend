# ===================== APPLICATION =====================
spring.application.name=fleet-dispatch-backend

# ===================== DATASOURCE =====================
# All values come from environment variables - never hard-coded.
# Defaults shown are for local development convenience only.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fleet_db}
spring.datasource.username=${DB_USERNAME:sai}
spring.datasource.password=${DB_PASSWORD:Saladi@2004}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== JPA / HIBERNATE =====================
# validate ONLY - the database already exists with real schema and data.
# Hibernate will check entity mappings against the real schema on startup
# and fail fast with a clear error on mismatch. It will NEVER alter tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# Disables Open Session In View - forces services to fetch what they need
# inside the transaction boundary rather than lazily hitting the DB from
# the web layer. Important given how relationship-heavy this schema is.
spring.jpa.open-in-view=false

# ===================== FLYWAY =====================
# Disabled for now - schema already exists and is managed externally.
# Will be enabled only when we introduce an actual new migration.
spring.flyway.enabled=false

# ===================== SERVER =====================
server.port=${SERVER_PORT:8080}

# ===================== JWT =====================
# No default on the secret - forces an explicit env var before the app
# can issue tokens, rather than silently running with a weak default.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================== ACTUATOR =====================
management.endpoints.web.exposure.include=health,info


app.dispatch.pending-expiry-hours=24
app.telemetry.dedup-window-seconds=30